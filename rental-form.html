<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бронирование лодки - Прокат лодок</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>🚤 Прокат лодок</h1>
            <nav>
                <a href="index.html">Главная</a>
                <a href="boats.html">Лодки</a>
                <a href="rental-form.html">Забронировать</a>
                <a href="send-test-email.php">Тест почты</a>
            </nav>
        </div>
    </header>

    <main>
        <div class="container">
            <div class="booking-form-container">
                <h2>Форма бронирования лодки</h2>
                <form id="bookingForm" action="submit-booking.php" method="POST">
                    <div class="form-group">
                        <label for="boat_name">Выберите лодку:</label>
                        <select id="boat_name" name="boat_name" required>
                            <option value="">Выберите лодку...</option>
                            <option value="Моторная лодка 1">Моторная лодка 1 (2000 ₽/час)</option>
                            <option value="Моторная лодка 2">Моторная лодка 2 (2500 ₽/час)</option>
                            <option value="Катер">Катер (3500 ₽/час)</option>
                            <option value="Яхта">Яхта (5000 ₽/час)</option>
                            <option value="Лодка для рыбалки">Лодка для рыбалки (1800 ₽/час)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="customer_name">Ваше имя:</label>
                        <input type="text" id="customer_name" name="customer_name" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" required>
                    </div>

                    <div class="form-group">
                        <label for="phone">Телефон:</label>
                        <input type="tel" id="phone" name="phone" required>
                    </div>

                    <div class="form-group">
                        <label for="start_date">Дата и время начала:</label>
                        <input type="datetime-local" id="start_date" name="start_date" required>
                    </div>

                    <div class="form-group">
                        <label for="end_date">Дата и время окончания:</label>
                        <input type="datetime-local" id="end_date" name="end_date" required>
                    </div>

                    <div class="form-group">
                        <label for="hours">Количество часов:</label>
                        <input type="number" id="hours" name="hours" readonly style="background: #f0f0f0;">
                    </div>

                    <div class="form-group">
                        <label for="price_per_hour">Цена за час (₽):</label>
                        <input type="text" id="price_per_hour" name="price_per_hour" readonly style="background: #f0f0f0;">
                    </div>

                    <div class="form-group">
                        <label for="total_price">Итого к оплате (₽):</label>
                        <input type="text" id="total_price" name="total_price" readonly style="background: #f0f0f0; font-size: 20px; font-weight: bold; color: #28a745;">
                    </div>

                    <div class="form-group">
                        <label for="comments">Комментарии:</label>
                        <textarea id="comments" name="comments" rows="3"></textarea>
                    </div>

                    <button type="submit" class="btn-submit">Забронировать</button>
                </form>
                <div id="message" style="margin-top: 20px;"></div>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 Прокат лодок. Все права защищены.</p>
        </div>
    </footer>

    <script>
    // Цены на лодки
    const boatPrices = {
        'Моторная лодка 1': 2000,
        'Моторная лодка 2': 2500,
        'Катер': 3500,
        'Яхта': 5000,
        'Лодка для рыбалки': 1800
    };

    // Обновление цены при выборе лодки
    document.getElementById('boat_name').addEventListener('change', function() {
        const boatName = this.value;
        if (boatName && boatPrices[boatName]) {
            document.getElementById('price_per_hour').value = boatPrices[boatName];
            calculateTotal();
        } else {
            document.getElementById('price_per_hour').value = '';
            document.getElementById('total_price').value = '';
        }
    });

    // Расчет стоимости
    function calculateTotal() {
        const startDate = new Date(document.getElementById('start_date').value);
        const endDate = new Date(document.getElementById('end_date').value);
        const pricePerHour = parseInt(document.getElementById('price_per_hour').value);

        if (startDate && endDate && pricePerHour && endDate > startDate) {
            const hours = Math.ceil((endDate - startDate) / (1000 * 60 * 60));
            document.getElementById('hours').value = hours;
            const total = hours * pricePerHour;
            document.getElementById('total_price').value = total;
        } else {
            document.getElementById('hours').value = '';
            document.getElementById('total_price').value = '';
        }
    }

    document.getElementById('start_date').addEventListener('change', calculateTotal);
    document.getElementById('end_date').addEventListener('change', calculateTotal);

    // Обработка отправки формы через AJAX
    document.getElementById('bookingForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const formData = new FormData(this);
        const messageDiv = document.getElementById('message');
        
        try {
            const response = await fetch('submit-booking.php', {
                method: 'POST',
                body: formData
            });
            
            const result = await response.json();
            
            if (result.success) {
                messageDiv.innerHTML = `
                    <div style="background: #d4edda; color: #155724; padding: 15px; border-radius: 5px;">
                        ✅ ${result.message}<br>
                        Номер бронирования: ${result.booking_id}
                    </div>
                `;
                this.reset();
            } else {
                messageDiv.innerHTML = `
                    <div style="background: #f8d7da; color: #721c24; padding: 15px; border-radius: 5px;">
                        ❌ ${result.message}
                    </div>
                `;
            }
        } catch (error) {
            messageDiv.innerHTML = `
                <div style="background: #f8d7da; color: #721c24; padding: 15px; border-radius: 5px;">
                    ❌ Ошибка при отправке. Попробуйте еще раз.
                </div>
            `;
        }
    });
    </script>
</body>
</html>
